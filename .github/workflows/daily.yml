name: Daily job digest

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC, about 7-8am Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      lookback_hours:
        description: "Preview: show matches from the last N hours (e.g. 168). Blank = normal run."
        required: false
        default: ""

permissions:
  contents: write           # lets the job save seen.json so you never get repeats

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run crawler and send email
        run: python job_crawler.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours }}
      - name: Save seen jobs
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
